    flex-direction: column;
    gap: 6px;
  }

  .field-group label {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-blue);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 6px;

    padding: 0 12px;
    height: 38px;

    align-items: center;
    gap: 8px;
    background-color: var(--bg-input);
    border: 1px solid var(--border-color);
    padding: 0 14px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s;
    height: 38px;
    box-sizing: border-box;
    width: auto;

    height: 17px;
    cursor: pointer;

    font-weight: 600;
    color: #f1f5f9;

<script>
function getEasterSunday(year) {
  var f = Math.floor,
      G = year % 19,
      C = f(year / 100),
      H = (C - f(C / 4) - f((8 * C + 13) / 25) + 19 * G + 15) % 30,
      I = H - f(H / 28) * (1 - f(29 / (H + 1)) * f((21 - G) / 11)),
      J = (year + f(year / 4) + I + 2 - C + f(C / 4)) % 7,
      L = I - J,
      month = 3 + f((L + 40) / 44),
      day = L + 28 - 31 * f(month / 4);
  return new Date(year, month - 1, day);
}

function evaluarFestivoCompleto(d) {
  if (!d || isNaN(d.getTime())) return { esFestivo: false, motivo: "" };

  var dayOfWeek = d.getDay();
  if (dayOfWeek === 0) return { esFestivo: true, motivo: "Domingo (SD)" };
  if (dayOfWeek === 6) return { esFestivo: true, motivo: "Sábado (SD)" };

  var year = d.getFullYear();
  var dm = String(d.getDate()).padStart(2, '0') + "/" + String(d.getMonth() + 1).padStart(2, '0');

  var festivosCatalunya = {
    "01/01": "Año Nuevo",
    "06/01": "Reyes",
    "01/05": "Fiesta del Trabajo",
    "24/06": "Sant Joan",
    "15/08": "La Asunción",
    "11/09": "Diada Nacional de Catalunya",
    "24/09": "La Mercè",
    "12/10": "Fiesta Nacional de España",
    "01/11": "Todos los Santos",
    "06/12": "Día de la Constitución",
    "08/12": "La Inmaculada",
    "25/12": "Navidad",
    "26/12": "Sant Esteve"
  };

  if (festivosCatalunya[dm]) {
    return { esFestivo: true, motivo: "Festivo: " + festivosCatalunya[dm] };
  }

  var easter = getEasterSunday(year);
  var viernesSanto = new Date(easter);
  viernesSanto.setDate(easter.getDate() - 2);
  var lunesPascua = new Date(easter);
  lunesPascua.setDate(easter.getDate() + 1);

  if (d.getDate() === viernesSanto.getDate() && d.getMonth() === viernesSanto.getMonth()) {
    return { esFestivo: true, motivo: "Viernes Santo" };
  }
  if (d.getDate() === lunesPascua.getDate() && d.getMonth() === lunesPascua.getMonth()) {
    return { esFestivo: true, motivo: "Lunes de Pascua" };
  }

  var diasSemana = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
  return { esFestivo: false, motivo: diasSemana[dayOfWeek] };
}

function parseFechaSegura(val) {
  if (!val) return null;
  if (val.indexOf("-") !== -1) {
    var p = val.split("-");
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  } else if (val.indexOf("/") !== -1) {
    var p2 = val.split("/");
    return new Date(parseInt(p2[2], 10), parseInt(p2[1], 10) - 1, parseInt(p2[0], 10));
  }
  return null;
}

function mostrarAviso(texto, tipo) {
  var b = document.getElementById("statusBox");
  if (!b) return;
  b.style.display = "block";
  b.className = (tipo === "ok") ? "status-ok" : "status-err";
  b.innerHTML = texto;
}

function toMinutes(t) {
  if (!t || typeof t !== "string" || t.indexOf(":") === -1) return 0;
  var parts = t.trim().split(":");
  var h = parseInt(parts[0], 10);
  var m = parseInt(parts[1], 10);
  return (isNaN(h) ? 0 : h) * 60 + (isNaN(m) ? 0 : m);
}

function fromMinutes(m) {
  var norm = (((m || 0) % 1440) + 1440) % 1440;
  var hh = String(Math.floor(norm / 60)).padStart(2, '0');
  var mm = String(norm % 60).padStart(2, '0');
  return hh + ":" + mm;
}

function formatDuration(m) {
  var val = isNaN(m) ? 0 : m;
  var hh = String(Math.floor(val / 60)).padStart(2, '0');
  var mm = String(val % 60).padStart(2, '0');
  return hh + "h " + mm + " min";
}

function diffMinutes(start, end) {
  var s = toMinutes(start);
  var e = toMinutes(end);
  if (e < s) e += 1440;
  return e - s;
}

function getSigla(texto) {
  if (!texto) return "";
  var clean = texto.toLowerCase();
  for (var key in estacionesDict) {
    if (clean.indexOf(key) !== -1) return estacionesDict[key];
  }
  var dm = clean.match(/\b(sc|vu|ga|cf|ep|br|en|vf|mr|co|lh|ae|ru|lr|vi|rp|rf|pu|lt|ma|tr|mq|bq|mo|gc|sl|mm|bt|mt|am|cy|bl|ct)\b/i);
  if (dm) return "(" + dm[1].toUpperCase() + ")";
  return "";
}

function obtenerColorLinea(tren, inicioSigla, finSigla, isSinServicio, isSC) {
  if (isSC) return "#718096";

  var cleanTren = (tren || "").replace(/^v\s*/i, "").replace(/\./g, "").trim();

  if (/^37\d*/.test(cleanTren)) return "#8e44ad";

  if (isSinServicio || (tren && tren.toLowerCase().indexOf("v ") === 0) || (tren && tren.toLowerCase() === "taxi")) {
    return "#c53030";
  }

  if (/^77\d*/.test(cleanTren)) return "#c05621";

  var ini = (inicioSigla || "").toUpperCase();
  var fin = (finSigla || "").toUpperCase();

  if (ini.indexOf("VU") !== -1 && fin.indexOf("SL") !== -1) return "#1e7e34";
  if (ini.indexOf("SL") !== -1 && fin.indexOf("CF") !== -1) return "#1e7e34";

  var esScBt = (ini.indexOf("SC") !== -1 && fin.indexOf("BT") !== -1) || (ini.indexOf("BT") !== -1 && fin.indexOf("SC") !== -1);
  if (esScBt) return "#1e7e34";

  var esVuBt = (ini.indexOf("VU") !== -1 && fin.indexOf("BT") !== -1) || (ini.indexOf("BT") !== -1 && fin.indexOf("VU") !== -1);
  if (/^28\d*/.test(cleanTren) && esVuBt) return "#1e7e34";

  var numBase = cleanTren.replace(/-\d+.*$/, "").trim();
  if (/^25\d*/.test(cleanTren) && ini.indexOf("VU") !== -1 && fin.indexOf("BT") !== -1 && trenes25ExtraVerde.indexOf(numBase) !== -1) {
    return "#1e7e34";
  }

  return "#000000";
}

  var fechaInput = document.getElementById("metaFecha").value;
  var festivoCheckbox = document.getElementById("metaFestivo").checked;

  var turnoNum = turnoNumInput;
  var fecha = "";
  var diaSemana = "";

  var headerMatch = bloqueTexto.match(/turno\s*(\w+)?\s*(?:para el\s*)?(?:día|dia)?\s*(\d{1,2}\/\d{1,2}\/\d{2,4})/i);
  if (headerMatch) {
    if (!turnoNum) turnoNum = headerMatch[1] ? headerMatch[1] : "";
    fecha = headerMatch[2];
  } else {
    var dMatch = bloqueTexto.match(/(\d{1,2}\/\d{1,2}\/\d{2,4})/);
    if (dMatch) fecha = dMatch[1];
  }

  if (!fecha && fechaInput) {
    var fParts = fechaInput.split("-");
    fecha = fParts[2] + "/" + fParts[1] + "/" + fParts[0];
  }

  var dObj = parseFechaSegura(fecha);
  var evaluacion = evaluarFestivoCompleto(dObj);

  if (dObj) {
    diaSemana = evaluacion.motivo.toLowerCase();
  }

  var textoLower = bloqueTexto.toLowerCase();
  var textoTieneFestivo = (textoLower.indexOf("festivo") !== -1 || textoLower.indexOf("domingo") !== -1 || textoLower.indexOf("sábado") !== -1 || textoLower.indexOf("sabado") !== -1 || /\b(sd|s\/d)\b/.test(textoLower));
  
  var esFestivoFinal = festivoCheckbox || evaluacion.esFestivo || textoTieneFestivo;

  var services = [];

  for (var k = 0; k < lines.length; k++) {
    var rawLine = lines[k];
    var line = rawLine.toLowerCase();

    if (line.indexOf("servicio") !== -1 && (line.indexOf("origen") !== -1 || line.indexOf("toma") !== -1)) continue;
    if (line.indexOf("turno") === 0 && line.indexOf("para el") !== -1) continue;

    var matches = rawLine.match(/\b([012]?\d:[0-5]\d)\b/g);
    if (!matches || matches.length < 2) continue;

    var isSC = (line.indexOf("act. complem") !== -1 || line.indexOf("servicios complementarios") !== -1 || line.endsWith(" ac") || line.indexOf(" ac ") !== -1 || line.endsWith(" sc"));
    var isSinServicio = (line.indexOf("viajes sin servicio") !== -1 || line.indexOf("viajero") !== -1 || line.indexOf("taxi") !== -1 || line.indexOf(" tx") !== -1 || line.indexOf(" vj") !== -1);
    var isConduccion = (line.indexOf("conducción") !== -1 || line.indexOf("conduccion") !== -1);

    var tren = "";
    var toma = "—";
    var inicioHora = "";
    var inicioSigla = "";
    var finHora = "";
    var finSigla = "";
    var deje = "—";

    if (isSC) {
      tren = "sc";
      if (rawLine.indexOf(">>") !== -1 && matches.length >= 3) {
        toma = matches[0];
        inicioHora = matches[1];
        finHora = matches[2];
      } else if (matches.length >= 4) {
        inicioHora = matches[1];
        finHora = matches[2];
      } else {
        inicioHora = matches[0];
        finHora = matches[1];
      }
      var preTime = rawLine.split(inicioHora)[0];
      inicioSigla = getSigla(preTime) || "(VU)";
      finSigla = inicioSigla;
    } else {
      var matchNum = rawLine.match(/\b([vV]?\d{4,5}|taxi|TAXI|rva|RVA)\b/);
      tren = matchNum ? matchNum[1].toLowerCase() : "";

      if (rawLine.indexOf(">>") !== -1 && matches.length >= 3) {
        toma = matches[0];
        inicioHora = matches[1];
        finHora = matches[2];
        deje = "—";
      } else if (matches.length >= 4) {
        toma = matches[0];
        inicioHora = matches[1];
        finHora = matches[2];
        deje = matches[3];
      } else if (matches.length === 3) {
        var esTomaAlInicio = /^\s*[012]?\d:[0-5]\d\b/.test(rawLine) && rawLine.indexOf("<<") === -1 && rawLine.indexOf(">>") === -1 && (rawLine.indexOf(" I ") !== -1 || rawLine.indexOf(" II ") !== -1);
        var esDejeFinal = !esTomaAlInicio && (rawLine.indexOf("<<") !== -1 || rawLine.indexOf(" I ") !== -1 || rawLine.indexOf(" II ") !== -1 || k === lines.length - 1);
        if (esDejeFinal) {
          toma = "—";
          inicioHora = matches[0];
          finHora = matches[1];
          deje = matches[2];
        } else {
          var idx1 = rawLine.indexOf(matches[1]);
          var idx2 = rawLine.indexOf(matches[2]);
          var between1and2 = rawLine.substring(idx1 + 5, idx2);
          if (/[a-záéíóúñ]/i.test(between1and2)) {
            toma = matches[0];
            inicioHora = matches[1];
            finHora = matches[2];
          } else {
            inicioHora = matches[0];
            finHora = matches[1];
            deje = matches[2];
          }
        }
      } else if (matches.length === 2) {
        inicioHora = matches[0];
        finHora = matches[1];
      }

      var preInicio = rawLine.substring(0, rawLine.indexOf(inicioHora));
      inicioSigla = getSigla(preInicio) || "(VU)";

      var preFin = rawLine.substring(rawLine.indexOf(inicioHora) + 5, rawLine.indexOf(finHora));
      var postFin = rawLine.substring(rawLine.indexOf(finHora) + 5);
      finSigla = getSigla(preFin) || getSigla(postFin) || "(VU)";

      if (tren === "taxi" || isSinServicio || (tren && tren.charAt(0) === 'v' && /\d/.test(tren))) {
        isSinServicio = true;
        if (tren.indexOf("v ") !== 0 && tren !== "taxi" && tren !== "rva") {
          tren = "v " + tren.replace(/^v/, "").trim();
        }
      }
    }

    if (tren === "28506") tren = "28506-27+VU35";

    var cleanTrenNum = tren.replace(/^v\s*/, "");
    if (esFestivoFinal && trenes32.indexOf(cleanTrenNum) !== -1) {
      if (!tren.endsWith("-32")) tren += "-32";
    }

    if (!isSinServicio && !isSC && line.indexOf("act.") === -1 && tren !== "rva") {
      isConduccion = true;
    }

    services.push({
      tren: tren || "—",
      toma: toma,
      inicioHora: inicioHora,
      inicioSigla: inicioSigla,
      finHora: finHora,
      finSigla: finSigla,
      deje: deje,
      isConduccion: isConduccion && !isSinServicio && !isSC,
      isSC: isSC,
      isSinServicio: isSinServicio
    });
  }

  if (services.length === 0) return null;

  var primeraToma = (services[0].toma !== "—") ? services[0].toma : services[0].inicioHora;
  var ultimoDeje = (services[services.length - 1].deje !== "—") ? services[services.length - 1].deje : services[services.length - 1].finHora;

  var jornadaTotalMin = diffMinutes(primeraToma, ultimoDeje);

  var conduccionTotalMin = 0;
  var descansoTotalMin = 0;
  var descansosFilas = [];

  for (var i = 0; i < services.length; i++) {
    var s = services[i];
    var duracionServicio = diffMinutes(s.inicioHora, s.finHora);
    var duracionFila = 0;

    if (s.isSC) {
      duracionFila = 0;
    } else if (s.isConduccion) {
      duracionFila = duracionServicio;
      conduccionTotalMin += duracionServicio;
    } else if (s.isSinServicio) {
      duracionFila = duracionServicio;
    } else {
      duracionFila = 0;
    }

    var descStr = "—";
    var descMin = 0;

    if (s.isSC) {
      descMin = diffMinutes(s.inicioHora, s.finHora);
      descansoTotalMin += descMin;
      descStr = (descMin >= 45) ? "* " + formatDuration(descMin) + " *" : formatDuration(descMin);
    } else if (i < services.length - 1) {
      var nextS = services[i + 1];
      descMin = diffMinutes(s.finHora, nextS.inicioHora);
      descansoTotalMin += descMin;
      descStr = (descMin >= 45) ? "* " + formatDuration(descMin) + " *" : formatDuration(descMin);
    }

    descansosFilas.push({ condMin: duracionFila, descStr: descStr, descMin: descMin });
  }

  var hayReset = false;
  for (var dIdx = 0; dIdx < descansosFilas.length; dIdx++) {
    if (descansosFilas[dIdx].descMin >= 45) {
      hayReset = true;
      break;
    }
  }

  var bloquesFatiga = [];
  var currentBlockStart = null;
  var currentBlockEnd = null;

  for (var f = 0; f < services.length; f++) {
    var sFat = services[f];
    var dFat = descansosFilas[f];

    if (sFat.isConduccion) {
      if (!currentBlockStart) currentBlockStart = sFat.inicioHora;
      currentBlockEnd = sFat.finHora;
    }

    if (dFat.descMin >= 45 || f === services.length - 1) {
      if (currentBlockStart && currentBlockEnd) {
        bloquesFatiga.push(diffMinutes(currentBlockStart, currentBlockEnd));
      }
      currentBlockStart = null;
      currentBlockEnd = null;
    }
  }

  var maxFatigaMin = 0;
  var maxBloqueIdx = 1;
  for (var b = 0; b < bloquesFatiga.length; b++) {
    if (bloquesFatiga[b] > maxFatigaMin) {
      maxFatigaMin = bloquesFatiga[b];
      maxBloqueIdx = b + 1;
    }
  }

  // UMBRAL DE FATIGA A 4H (240 MINUTOS)
  var limite = "";
  if (!hayReset || maxFatigaMin >= 240) {
    limite = "5:30";
  } else {
    limite = "";
  }

  var fatigaReport = formatDuration(maxFatigaMin) + " (" + maxBloqueIdx + "º bloque)";
  var fatigaConAsterisco = false;
  if (maxFatigaMin >= 240) {
    fatigaReport = "* " + fatigaReport;
    fatigaConAsterisco = true;
  }

  var titulo = "";
  var etiquetaDia = (diaSemana && diaSemana.indexOf("sábado") === -1 && diaSemana.indexOf("domingo") === -1 && diaSemana.indexOf("festivo") === -1) ? diaSemana + " " : "";

  if (turnoNum && fecha) {
    titulo = "turno " + turnoNum + " para el " + etiquetaDia + fecha;
  } else if (turnoNum) {
    titulo = "turno " + turnoNum;
  } else if (fecha) {
    titulo = "turno para el " + etiquetaDia + fecha;
  } else {
    titulo = "turno";
  }

  if (esFestivoFinal && titulo.indexOf("festivo") === -1) {
    titulo += " (festivo)";
  }
  titulo = titulo.replace(/\s+/g, ' ').trim();

  // Markdown limpio sin coche ni casa
  var md = titulo + "\n\n";
  md += "| límite | jornada total | conducción real | descanso total | fatiga |\n";
  md += "| :---: | :---: | :---: | :---: | :---: |\n";
  md += "| " + limite + " | " + formatDuration(jornadaTotalMin) + " | " + formatDuration(conduccionTotalMin) + " | " + formatDuration(descansoTotalMin) + " | " + fatigaReport + " |\n\n";

  md += "| tren | toma | inicio | fin | deje | conducción | descanso |\n";
  md += "| :---: | :---: | :---: | :---: | :---: | :---: | :---: |\n";

  for (var m = 0; m < services.length; m++) {
    var sm = services[m];
    var dm = descansosFilas[m];
    var tomaCol = (sm.toma !== "—") ? sm.toma : "—";
    var dejeCol = (sm.deje !== "—") ? sm.deje : "—";
    md += "| " + sm.tren + " | " + tomaCol + " | " + sm.inicioHora + " " + sm.inicioSigla + " | " + sm.finHora + " " + sm.finSigla + " | " + dejeCol + " | " + formatDuration(dm.condMin) + " | " + dm.descStr + " |\n";
  }

  var t1HeaderStyle = "border: none !important; mso-border-alt: none !important; padding: 4px 0px 8px 0px; font-family: Calibri, sans-serif; font-size: 12pt; font-weight: normal; text-align: center; white-space: nowrap;";
  var t1DataStyle = "border: none !important; mso-border-alt: none !important; padding: 8px 0px 4px 0px; font-family: Calibri, sans-serif; font-size: 12pt; font-weight: normal; text-align: center; white-space: nowrap;";
  var t2BaseStyle = "border: none !important; mso-border-alt: none !important; padding: 3px 0px; font-family: Calibri, sans-serif; font-size: 12pt; font-weight: normal; text-align: center; white-space: nowrap;";

  var htmlWord = '<p style="font-family: Calibri, sans-serif; font-size: 12pt; margin: 0 0 10pt 0; font-weight: normal; color: #000000; text-align: left;">' + titulo.toLowerCase() + '</p>';

  var fatigaContenidoWord = fatigaReport;
  if (fatigaConAsterisco) {
    fatigaContenidoWord = '<span style="background-color: #ffff00; mso-highlight: yellow; padding: 1px 4px; border-radius: 2px;">' + fatigaReport + '</span>';
  }

  // Tabla 1: Resumen (Exactamente 5 columnas sin coche ni casa)
  htmlWord += '<table border="0" align="center" cellpadding="0" cellspacing="0" style="border-collapse: collapse; border: none !important; mso-border-alt: none !important; font-family: Calibri, sans-serif; font-size: 12pt; width: 19.2cm; max-width: 19.2cm; margin-left: auto; margin-right: auto; margin-bottom: 16pt; table-layout: fixed; color: #000000;">';
  htmlWord += '<tr>';
  htmlWord += '<td style="' + t1HeaderStyle + ' width: 2.2cm;">límite</td>';
  htmlWord += '<td style="' + t1HeaderStyle + ' width: 4.0cm;">jornada total</td>';
  htmlWord += '<td style="' + t1HeaderStyle + ' width: 4.2cm;">conducción real</td>';
  htmlWord += '<td style="' + t1HeaderStyle + ' width: 4.0cm;">descanso total</td>';
  htmlWord += '<td style="' + t1HeaderStyle + ' width: 4.8cm;">fatiga</td>';
  htmlWord += '</tr>';

  htmlWord += '<tr>';
  htmlWord += '<td style="' + t1DataStyle + '">' + limite + '</td>';
  htmlWord += '<td style="' + t1DataStyle + '">' + formatDuration(jornadaTotalMin) + '</td>';
  htmlWord += '<td style="' + t1DataStyle + '">' + formatDuration(conduccionTotalMin) + '</td>';
  htmlWord += '<td style="' + t1DataStyle + '">' + formatDuration(descansoTotalMin) + '</td>';
  htmlWord += '<td style="' + t1DataStyle + '">' + fatigaContenidoWord + '</td>';
  htmlWord += '</tr>';
  htmlWord += '</table><br style="line-height: 8pt;">';

  // Tabla 2: Servicios
  htmlWord += '<table border="0" align="center" cellpadding="0" cellspacing="0" style="border-collapse: collapse; border: none !important; mso-border-alt: none !important; font-family: Calibri, sans-serif; font-size: 12pt; width: 19.2cm; max-width: 19.2cm; margin-left: auto; margin-right: auto; table-layout: fixed;">';
  htmlWord += '<tr style="color: #000000;">';
  htmlWord += '<td style="' + t2BaseStyle + ' width: 2.9cm;">tren</td>';
  htmlWord += '<td style="' + t2BaseStyle + ' width: 1.6cm;">toma</td>';
  htmlWord += '<td style="' + t2BaseStyle + ' width: 2.8cm;">inicio</td>';
  htmlWord += '<td style="' + t2BaseStyle + ' width: 2.8cm;">fin</td>';
  htmlWord += '<td style="' + t2BaseStyle + ' width: 1.6cm;">deje</td>';
  htmlWord += '<td style="' + t2BaseStyle + ' width: 2.9cm;">conducción</td>';
  htmlWord += '<td style="' + t2BaseStyle + ' width: 4.6cm;">descanso</td>';
  htmlWord += '</tr>';

  for (var n = 0; n < services.length; n++) {
    var sn = services[n];
    var dn = descansosFilas[n];
    var tomaC = (sn.toma !== "—") ? sn.toma : "—";
    var dejeC = (sn.deje !== "—") ? sn.deje : "—";

    var colorFila = obtenerColorLinea(sn.tren, sn.inicioSigla, sn.finSigla, sn.isSinServicio, sn.isSC);
    var rowStyle = t2BaseStyle + " color: " + colorFila + ";";

    var esReset = (dn.descMin >= 45);

    var finTxt = sn.finHora + ' ' + sn.finSigla;
    if (esReset) {
      finTxt = '<span style="background-color: #ffff00; mso-highlight: yellow; padding: 1px 4px; border-radius: 2px;">' + finTxt + '</span>';
    }

    var descTxt = dn.descStr;
    if (esReset) {
      descTxt = '<span style="background-color: #ffff00; mso-highlight: yellow; padding: 1px 4px; border-radius: 2px;">' + descTxt + '</span>';
    }

    htmlWord += '<tr style="color: ' + colorFila + ';">';
    htmlWord += '<td style="' + rowStyle + '">' + sn.tren + '</td>';
    htmlWord += '<td style="' + rowStyle + '">' + tomaC + '</td>';
    htmlWord += '<td style="' + rowStyle + '">' + sn.inicioHora + ' ' + sn.inicioSigla + '</td>';
    htmlWord += '<td style="' + rowStyle + '">' + finTxt + '</td>';
    htmlWord += '<td style="' + rowStyle + '">' + dejeC + '</td>';
    htmlWord += '<td style="' + rowStyle + '">' + formatDuration(dn.condMin) + '</td>';
    htmlWord += '<td style="' + rowStyle + '">' + descTxt + '</td>';
    htmlWord += '</tr>';
  }
  htmlWord += '</table>';

  var fixSiglas = function(txt) {
    return txt.toLowerCase().replace(/\((sc|vu|ga|cf|ep|br|en|vf|mr|co|lh|ae|ru|lr|vi|rp|rf|pu|lt|ma|tr|mq|bq|mo|gc|sl|mm|bt|mt|am|cy|bl|ct)\)/gi, function(match) {
      return match.toUpperCase();
    });
  };

  return {
    titulo: titulo,
    md: fixSiglas(md),
    html: fixSiglas(htmlWord)
  };
}

var rawHtmlParaWord = "";

function ejecutarProcesamiento() {
  var inputEl = document.getElementById("inputText");
  if (!inputEl) return 0;
  var input = inputEl.value;

  if (!input || input.trim().length === 0) {
    var b = document.getElementById("statusBox");
    if (b) b.style.display = "none";
    document.getElementById("outputText").innerText = "";
    document.getElementById("visualWordTable").innerHTML = '<span style="color: #718096;">Introduce un turno o selecciona una fecha...</span>';
    rawHtmlParaWord = "";
    return 0;
  }

  if (/^salida sin servicio$/i.test(input.trim())) {
    var turnoSinServicioMatch = document.getElementById("metaTurnoNum").value.trim().match(/^\d+/);
    var tituloSinServicio = turnoSinServicioMatch ? "Turno " + turnoSinServicioMatch[0] + " — Salida sin servicio" : "Salida sin servicio";
    document.getElementById("outputText").innerText = tituloSinServicio;
    document.getElementById("visualWordTable").textContent = tituloSinServicio;
    rawHtmlParaWord = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'></head><body><p style='font-family:Calibri,sans-serif;font-size:12pt;'>" + tituloSinServicio + "</p></body></html>";
    mostrarAviso("Turno procesado: salida sin servicio.", "ok");
    return 1;
  }

  var rawLines = input.split("\n");
  var bloques = [];
  var bloqueActual = [];

  for (var i = 0; i < rawLines.length; i++) {
    var lineTrim = rawLines[i].trim();
    if (/^(turno\s+\w+|d[íi]a\s+\d+)/i.test(lineTrim)) {
      if (bloqueActual.length > 0) {
        var txtPrevio = bloqueActual.join("\n");
        if (/\b[012]?\d:[0-5]\d\b/.test(txtPrevio)) {
          bloques.push(txtPrevio);
          bloqueActual = [];
        }
      }
    }
    bloqueActual.push(rawLines[i]);
  }
  if (bloqueActual.length > 0) {
    var txtFinal = bloqueActual.join("\n");
    if (/\b[012]?\d:[0-5]\d\b/.test(txtFinal)) {
      bloques.push(txtFinal);
    }
  }

  var totalProcesados = 0;
  var mdGlobal = "";
  var contenidoTurnos = "";
  var htmlVisual = "";

  for (var b = 0; b < bloques.length; b++) {
    var res = procesarUnTurno(bloques[b]);
    if (res) {
      if (totalProcesados > 0) {
        mdGlobal += "\n\n---\n\n";
        contenidoTurnos += '<br clear="all" style="page-break-before: always; mso-break-type: page-break;" />';
        htmlVisual += '<div style="border-top: 2px dashed #718096; margin: 25px 0;"></div>';
      }
      totalProcesados++;
      mdGlobal += res.md;
      contenidoTurnos += res.html;
      htmlVisual += res.html;
    }
  }

  if (totalProcesados === 0) {
    mostrarAviso("No se ha detectado ningún turno con horas válidas.", "err");
    return 0;
  }

  var docCompleto = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>";
  docCompleto += "<head><meta charset='utf-8'>";
  docCompleto += "<style>";
  docCompleto += "@page { size: 23.5cm 16.0cm; mso-page-orientation: landscape; margin: 2.0cm 2.15cm 2.0cm 2.15cm; }";
  docCompleto += "body { font-family: Calibri, sans-serif; font-size: 12pt; }";
  docCompleto += "</style></head><body>";
  docCompleto += contenidoTurnos;
  docCompleto += "</body></html>";

  rawHtmlParaWord = docCompleto;
  document.getElementById("outputText").innerText = mdGlobal.trim();
  document.getElementById("visualWordTable").innerHTML = htmlVisual;

  mostrarAviso("Turno procesado correctamente.", "ok");
  return totalProcesados;
}

function buscarYDesplegarTurno() {
  var rawNum = document.getElementById("metaTurnoNum").value.trim();
  var checkFestivo = document.getElementById("metaFestivo");
  var txt = document.getElementById("inputText");

  if (!rawNum) return;

  if (/\b(sd|s\/d|festivo)\b/i.test(rawNum)) {
    checkFestivo.checked = true;
  } else if (/\b(lmxjv|laborable)\b/i.test(rawNum)) {
    checkFestivo.checked = false;
  }

  var num = rawNum.replace(/\b(sd|s\/d|festivo|lmxjv|laborable)\b/gi, "").replace(/[()]/g, "").trim();

  if (turnosGraficoDB.hasOwnProperty(num)) {
    var entrada = turnosGraficoDB[num];
    var contenido = "";

    if (entrada.comun) {
      contenido = entrada.comun;
    } else if (checkFestivo.checked && entrada.sd) {
      contenido = entrada.sd;
    } else if (entrada.lmxjv) {
      contenido = entrada.lmxjv;
    }

    if (contenido) {
      txt.value = contenido;
    }
  }
  ejecutarProcesamiento();
}

function copiarDirectoParaWord() {
  var inputEl = document.getElementById("inputText");
  if (!inputEl || !inputEl.value.trim()) {
    mostrarAviso("El cuadro está vacío. Introduce un turno o selecciona una fecha.", "err");
    return;
  }

  var count = ejecutarProcesamiento();
  if (count === 0) return;

  var copiado = false;
  function onCopy(e) {
    e.clipboardData.setData("text/html", rawHtmlParaWord);
    e.clipboardData.setData("text/plain", document.getElementById("outputText").innerText);
    e.preventDefault();
    copiado = true;
  }

  document.addEventListener("copy", onCopy);
  try {
    document.execCommand("copy");
  } catch(err) {
    copiado = false;
  }
  document.removeEventListener("copy", onCopy);

  if (!copiado && navigator.clipboard && navigator.clipboard.write) {
    var blobHtml = new Blob([rawHtmlParaWord], { type: "text/html" });
    var blobText = new Blob([document.getElementById("outputText").innerText], { type: "text/plain" });
    navigator.clipboard.write([
      new ClipboardItem({ "text/html": blobHtml, "text/plain": blobText })
    ]).then(function() {
      mostrarAviso("¡Copiado con éxito! Ve a Word y pulsa Ctrl + V.", "ok");
    }).catch(function(e) {
      mostrarAviso("Error al copiar al portapapeles: " + e.message, "err");
    });
    return;
  }

  if (copiado) {
    mostrarAviso("¡Copiado con éxito! Ve a Word y pulsa Ctrl + V.", "ok");
  } else {
    mostrarAviso("El navegador no permitió la inyección directa. Prueba con Ctrl + C.", "err");
  }
}

function inicializarDatalist() {
  var dl = document.getElementById("turnosList");
  var keys = Object.keys(turnosGraficoDB).sort(function(a, b) {
    return parseInt(a, 10) - parseInt(b, 10);
  });
  for (var i = 0; i < keys.length; i++) {
    var opt = document.createElement("option");
    opt.value = keys[i];
    dl.appendChild(opt);
  }
}

document.addEventListener("DOMContentLoaded", function() {
  inicializarDatalist();

  var btnW = document.getElementById("btnCopiarWord");
  var btnL = document.getElementById("btnLimpiar");
  var txt = document.getElementById("inputText");
  var inputTurno = document.getElementById("metaTurnoNum");
  var inputFecha = document.getElementById("metaFecha");
  var checkFestivo = document.getElementById("metaFestivo");
  var badge = document.getElementById("fechaBadge");

  if (btnW) btnW.addEventListener("click", copiarDirectoParaWord);

  if (btnL) btnL.addEventListener("click", function() {
    txt.value = "";
    inputTurno.value = "";
    inputFecha.value = "";
    checkFestivo.checked = false;
    if (badge) badge.style.display = "none";
    ejecutarProcesamiento();
    inputTurno.focus();
  });

  inputTurno.addEventListener("input", buscarYDesplegarTurno);

  checkFestivo.addEventListener("change", function() {
    buscarYDesplegarTurno();
  });

  inputFecha.addEventListener("change", function() {
    var d = parseFechaSegura(inputFecha.value);
    if (d) {
      var ev = evaluarFestivoCompleto(d);
      checkFestivo.checked = ev.esFestivo;
      if (badge) {
        badge.textContent = ev.motivo;
        badge.className = ev.esFestivo ? "badge-tag badge-festivo" : "badge-tag badge-laborable";
        badge.style.display = "inline-block";
      }
    } else {
      if (badge) badge.style.display = "none";
    }
    buscarYDesplegarTurno();
  });

  txt.addEventListener("input", ejecutarProcesamiento);

  ejecutarProcesamiento();
});
</script>
